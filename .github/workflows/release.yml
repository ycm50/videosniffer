name: Release Build

# 手动触发构建发布（Actions 页点 "Run workflow"）
# 版本自动递增：v1.0 -> v1.1 -> ... -> v1.9 -> v2.0 -> ... -> v2.9 -> v3.0
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含历史标签）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 计算下一个版本号（tag 递增）
        id: version
        shell: bash
        run: |
          # 取形如 vX.Y 的最新标签
          latest=$(git tag -l 'v[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n | tail -1)
          if [ -z "$latest" ]; then
            major=1; minor=0
          else
            major=${latest%%.*}
            minor=${latest##*.}
            minor=$((minor + 1))
            if [ $minor -ge 10 ]; then minor=0; major=$((major + 1)); fi
          fi
          next="${major}.${minor}"
          code=$((major * 10 + minor))
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "本次版本: v${next} (versionCode=$code)"

      - name: 准备签名密钥（固定内嵌）
        run: |
          echo '' | base64 -d > /tmp/release.keystore
          echo "KEYSTORE_PATH=/tmp/release.keystore" >> "$GITHUB_ENV"
          echo "使用固定签名密钥（密码 123456）"

      - name: 构建 release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PVERSION_NAME="${{ steps.version.outputs.next }}" \
            -PVERSION_CODE="${{ steps.version.outputs.code }}"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "上传 APK: $APK"
          gh release create "${{ steps.version.outputs.tag }}" "$APK" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --generate-notes
