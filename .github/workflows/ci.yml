# =============================================================================
# CI：编译 + 单元测试门禁
#
# 触发：push / pull_request（release.yml 是手动触发的发布流程，两者互不影响）
# 目的：任何提交都必须「能编译 + 单测全绿」，避免像 v1.1 那样改动堆积到发布前才暴露。
# =============================================================================

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 不使用 android-actions/setup-android：该 action 在 runner 上曾导致构建直接失败
      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            # 工程使用 AGP 9 的 compileSdk = release(36) { minorApiLevel = 1 }
            "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.1.0" > /dev/null 2>&1 \
              && echo "Installed platforms;android-36.1 + build-tools;36.1.0" \
              || echo "::warning::sdkmanager install failed; relying on preinstalled SDK"
          fi

          echo "--- platforms ---"
          ls -1 "$SDK/platforms" 2>/dev/null || true

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # 与 release.yml 相同的镜像配置：CI 层面把 Maven Central / Google 换到阿里云，
      # 避免 runner 访问 repo.maven.apache.org 出现 403。
      - name: Create Gradle init script with Aliyun mirror
        run: |
          cat > init-ci.gradle << 'SCRIPT'
          gradle.settingsEvaluated { settings ->
            settings.pluginManagement.repositories.each { repo ->
              if (repo instanceof MavenArtifactRepository) {
                if (repo.url.toString().contains('repo.maven.apache.org')) {
                  repo.setUrl('https://maven.aliyun.com/repository/public')
                }
                if (repo.url.toString().contains('maven.google.com') || repo.url.toString().contains('dl.google.com')) {
                  repo.setUrl('https://maven.aliyun.com/repository/google')
                }
              }
            }
          }
          gradle.projectsLoaded { g ->
            g.rootProject.buildscript.repositories.each { repo ->
              if (repo instanceof MavenArtifactRepository) {
                if (repo.url.toString().contains('repo.maven.apache.org')) {
                  repo.setUrl('https://maven.aliyun.com/repository/public')
                }
                if (repo.url.toString().contains('maven.google.com') || repo.url.toString().contains('dl.google.com')) {
                  repo.setUrl('https://maven.aliyun.com/repository/google')
                }
              }
            }
          }
          SCRIPT

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew -I init-ci.gradle testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew -I init-ci.gradle assembleDebug --console=plain

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
